# RIGHT arm motor control law, read by openarm_hardware (v10_simple_hardware.cpp)
# once, when the hardware starts: edit, then restart terminal 1 (the stack).
# Created 2026-11-17, with the left arm's (see calibration/motor_gains_left.yaml
# for what each key does, the bounds and the all-or-nothing rule).
#
# The right arm gets the two switches the controller yaml change brings to both
# arms (velocity feed-forward, the integral held while the command moves), so
# they can be turned off here per arm. No gains profile: the precision work was
# on the left arm, and nothing here has been tried on the right one.

arm: right

velocity_feedforward: true
integral_freeze_while_moving: true
freeze_rate: 0.01     # rad/s
freeze_hold: 0.15     # s
zero_velocity_when_held: true

profile_enabled: true    # 2026-11-17 17:40: on -- j1 stopped 25-50 mrad short of every target with ki 20
# (2026-11-17 17:40: the same profile as the left arm -- the right j1 also stopped
# 13-47 mrad short of pre_pick)
joints:
  joint1: {ki: 60.0, gate_in: 0.001, gate_out: 0.002}
  joint2: {ki: 60.0, gate_in: 0.001, gate_out: 0.002}
  joint3: {ki: 60.0, gate_in: 0.001, gate_out: 0.002}
  joint4: {ki: 60.0, gate_in: 0.001, gate_out: 0.002}
  joint5: {kp: 10.0, ki: 20.0, gate_in: 0.001, gate_out: 0.003}
  joint6: {kp: 10.0, ki: 20.0, gate_in: 0.001, gate_out: 0.003}
  joint7: {kp: 10.0, ki: 20.0, gate_in: 0.001, gate_out: 0.003}

# A motor that stops driving mid-run (2026-11-18: left joint2 went status 1 -> 0, a
# brownout-style restart, and hung limp): held at its measured position, re-enabled
# every 0.2 s (at most 25 times; only status 0, 9 under-voltage, 13 CAN lost -- a
# real fault is left alone), then eased back to the command at reenable_rate rad/s.
# Off: the motor stays limp until terminal 1 is restarted (the app STOPs either way).
auto_reenable: true
reenable_rate: 0.25   # rad/s, 0.05 .. 1.0
