# The updater below lives in moveit_ros_perception (installed here as
# 2.5.10). It is what keeps the robot out of its own map: a mesh self-filter
# renders the arm and the gripper from the URDF at the live TF and drops
# those pixels from the depth image *before* they become voxels. The camera
# image is untouched -- nothing is hidden or painted over, and the colour
# stream the detector reads never passes through here at all.
#
# If move_group ever comes up without it, it logs a pluginlib failure and
# runs with no map: every plan then checks against an empty world while
# every log line says the map was captured. capture_octomap reports the
# voxel count after each refresh for exactly that reason.
#
octomap_frame: world
# Voxel edge length, metres. 0.05 was coarser than the things being picked up:
# a screwdriver is a couple of centimetres across, so at 50 mm it and the
# table under it merged into one block, and the gripper could not be given a
# path to it that was not "inside an obstacle". 0.02 resolves the object from
# the surface.
#
# The cost is leaf count, which for an octree scales with observed *surface*
# rather than volume -- about 6x here -- and is why max_range is cut to the
# work area below rather than left at the sensor's 5 m.
octomap_resolution: 0.02
# The work surface is well inside a metre of the base; anything past that is
# the room, and voxelising the room at 20 mm is pure cost. workspace_radius in
# the orchestrator refuses detections beyond 1.0 m for the same reason.
max_range: 1.5
sensors:
  - realsense_depth
realsense_depth:
  sensor_plugin: occupancy_map_monitor/DepthImageOctomapUpdater
  image_topic: /camera/camera/depth/image_rect_raw
  queue_size: 5
  near_clipping_plane_distance: 0.3
  # Matched to max_range above: depth past the work area is discarded before
  # it ever becomes voxels.
  far_clipping_plane_distance: 1.5
  shadow_threshold: 0.2
  # The self-filter. This updater renders the robot from the URDF at the
  # current TF and removes those pixels from the depth image *before* they
  # become voxels -- which is how the arm and the gripper are kept out of
  # the map without touching the camera image. padding_scale multiplies the
  # rendered depth and padding_offset adds metres to it, so the pair is how
  # much margin the filter leaves around the robot's own surfaces.
  #
  # 2.0 and 0.20 m were far too generous: 20 cm of margin behind every
  # robot surface erases the table under the gripper along with the
  # gripper -- and an object being reached for is by then within 20 cm of
  # the gripper, so it goes too.
  #
  # Measured by bisection on this robot, not chosen from a template:
  #
  #   0.20  the gripper is gone -- and so is the table under it, and the
  #         object being reached for, which is within 20 cm of the gripper
  #         by the time it matters
  #   0.05  whole voxels sitting on the gripper, with the hand drawn red
  #         in the planning scene because its own start state collides
  #
  # 0.12 is the next step between them. The filter can only remove the
  # robot where it thinks the robot is, so the margin has to cover the
  # camera mount being a centimetre or two out and the collision meshes
  # being coarser than the real parts -- a margin this large is a
  # *symptom*, and the cure is calibrating the camera mount, not padding.
  padding_scale: 1.1
  padding_offset: 0.12
  max_update_rate: 5.0