controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    left_forward_position_controller:
      type: forward_command_controller/ForwardCommandController

    left_forward_velocity_controller:
      type: forward_command_controller/ForwardCommandController

    left_joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    left_gripper_controller:
      type: position_controllers/GripperActionController

    right_forward_position_controller:
      type: forward_command_controller/ForwardCommandController

    right_forward_velocity_controller:
      type: forward_command_controller/ForwardCommandController

    right_joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    right_gripper_controller:
      type: position_controllers/GripperActionController


left_forward_position_controller:
  ros__parameters:
    joints:
      - openarm_left_joint1
      - openarm_left_joint2
      - openarm_left_joint3
      - openarm_left_joint4
      - openarm_left_joint5
      - openarm_left_joint6
      - openarm_left_joint7
    interface_name: position
    command_interfaces:
      - position
    state_interfaces:
      - position

left_forward_velocity_controller:
  ros__parameters:
    joints:
      - openarm_left_joint1
      - openarm_left_joint2
      - openarm_left_joint3
      - openarm_left_joint4
      - openarm_left_joint5
      - openarm_left_joint6
      - openarm_left_joint7
    interface_name: velocity
    command_interfaces:
      - velocity
    state_interfaces:
      - velocity

left_joint_trajectory_controller:
  ros__parameters:
    joints:
      - openarm_left_joint1
      - openarm_left_joint2
      - openarm_left_joint3
      - openarm_left_joint4
      - openarm_left_joint5
      - openarm_left_joint6
      - openarm_left_joint7
    interface_name: position
    # 2026-11-17: position AND velocity. The velocity is the trajectory's own,
    # and the driver (openarm_hardware, mit_law.hpp) hands it to the motor as
    # its velocity target. With position only, nothing wrote the velocity, the
    # motor's target speed was 0 and its damping braked every move: the arm
    # lagged (kd/kp) x speed, ~190 mrad on joint 7 in the drop move, and the
    # integral wound up on that lag and overshot after the stop. Off switch:
    # back to [position] (restart), or velocity_feedforward: false in
    # calibration/motor_gains_<arm>.yaml.
    command_interfaces:
      - position
      - velocity
    # Still position only (phase A). Phase B, only after the robot checks
    # (rest check, arrivals.jsonl) have proven the driver changes: state
    # [position, velocity], constraints.stopped_velocity_tolerance 0.05,
    # goal_time 2.0 and a per-joint goal 0.02, so success means "arrived"
    # rather than "time is up". With a position-only state the JTC treats the
    # velocity error as 0 and skips 0 tolerances, so completion is unchanged.
    state_interfaces:
      - position

    state_publish_rate: 50.0 # Defaults to 50
    action_monitor_rate: 50.0 # Defaults to 20

    allow_partial_joints_goal: false # Defaults to false
    # Stated, not changed (true is the default): cuRobo's last point is not
    # exactly at rest, and false would refuse those trajectories. The JTC then
    # holds the last point with its velocity; the driver drops the velocity of
    # a held point (mit_law.hpp), so it cannot keep pushing the joint.
    allow_nonzero_velocity_at_trajectory_end: true
    constraints:
      stopped_velocity_tolerance: 0.01 # Defaults to 0.01
      goal_time: 0.0 # Defaults to 0.0 (start immediately)

left_gripper_controller:
  ros__parameters:
    joint: openarm_left_finger_joint1
    command_interfaces:
      - position
    state_interfaces:
      - position
    max_effort: 50.0


right_forward_position_controller:
  ros__parameters:
