joint4:
  limit:
    # Not 0.0. The elbow rests marginally past it -- both arms report
    # joint4 at -0.000191 rad with the robot idle -- so a lower limit of
    # exactly zero makes the robot's own resting posture illegal, and every
    # plan then starts from a state outside the limits. cuRobo normalises
    # joint values against these bounds; asked to plan from that state it
    # took SIGFPE (exit code -8) and died.
    #
    # -0.05 rad is 2.9 degrees of hyperextension, which the hardware
    # evidently already has. It describes the robot rather than inventing
    # slack.
    lower: -0.05
    upper: 2.443461
    velocity: 5.445426
    effort: 27

